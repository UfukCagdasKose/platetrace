services:
  db:
    image: postgres:16
    container_name: agis_db
    environment:
      POSTGRES_USER: agis
      POSTGRES_PASSWORD: agis
      POSTGRES_DB: agis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agis"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: agis_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://agis:agis@db:5432/agis
    ports:
      - "8000:8000"
    volumes:
      - ./app:/srv/app
      - ./data:/srv/data
      - ./analytics:/srv/analytics
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build: ./dashboard
    container_name: agis_dashboard
    depends_on:
      - api
    environment:
      # Tarayicida calisan kod fetch() yapiyor, container icinden degil --
      # bu yuzden Docker network adi (api:8000) degil, host'tan gorunen
      # yayinlanmis port (localhost:8000) dogru.
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard/src:/srv/src
      - ./dashboard/index.html:/srv/index.html
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
